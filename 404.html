<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>찾을 수 없는 페이지 | 웹사이트 제작 워크플로우</title>
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages 프로젝트 주소(/저장소/)에서도 깊은 경로의 상대 주소가 맞게 기준 주소를 정한다.
    (function () {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
      var b = document.createElement('base'); b.href = base; document.head.appendChild(b);
      try { var m = localStorage.getItem('mode'); if (m === 'dark' || m === 'light') document.documentElement.dataset.mode = m; } catch (e) {}
    })();
  </script>
  <script type="module" src="js/not-found-page.js"></script>
  <link rel="stylesheet" href="vendor/fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="container site-header__inner"><a class="brand" href="./">웹사이트 제작 워크플로우</a></div>
  </header>
  <main id="main" class="site-main">
    <div class="container state state--notfound">
      <h1 class="state__title">찾을 수 없는 페이지입니다</h1>
      <p>주소가 바뀌었거나 잘못 입력되었습니다. 홈에서 가이드를 고르세요.</p>
      <ul class="state__links">
        <li><a class="state__link" href="./">홈으로 가기</a></li>
      </ul>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
