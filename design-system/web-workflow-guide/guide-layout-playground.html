<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가이드 여백 플레이그라운드</title>
<!--
  가이드 화면(폭 1280px 이상)의 왼쪽 여백을 실제 사이트에 바로 적용해 보는 도구.
  사이트와 같은 서버에서 열어야 한다: python -m http.server 8000 --bind 127.0.0.1
  → http://localhost:8000/design-system/web-workflow-guide/guide-layout-playground.html
  값은 css/site.css 의 .guide 변수(--guide-max 등)와 같다.
-->
<style>
  :root { --ui-bg: #111318; --ui-panel: #181b22; --ui-line: #2a2f3a; --ui-text: #e6e8ee; --ui-dim: #9aa1b0; --ui-accent: #7aa2ff; --ui-mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--ui-bg); color: var(--ui-text); font: 14px/1.5 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
  .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; }
  .controls { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 20px 18px; background: var(--ui-panel); border-right: 1px solid var(--ui-line); }
  h1 { margin: 0; font-size: 16px; }
  .sub { margin: -8px 0 0; color: var(--ui-dim); font-size: 12px; }
  fieldset { margin: 0; padding: 12px 0 0; border: 0; border-top: 1px solid var(--ui-line); }
  legend { padding: 0; margin-bottom: 8px; color: var(--ui-dim); font-size: 12px; }
  .row { display: grid; gap: 4px; margin-bottom: 12px; }
  .row label { display: flex; justify-content: space-between; font-size: 13px; }
  .row output { font-family: var(--ui-mono); color: var(--ui-accent); }
  .row small { color: var(--ui-dim); font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--ui-accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip, .preset, .copy { padding: 6px 10px; border: 1px solid var(--ui-line); border-radius: 8px; background: transparent; color: var(--ui-text); font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed=true], .preset[aria-pressed=true] { border-color: var(--ui-accent); color: var(--ui-accent); }
  .chip:hover, .preset:hover, .copy:hover { border-color: #3c4352; }
  :is(.chip, .preset, .copy, input):focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
  .presets { display: grid; gap: 6px; }
  .preset { text-align: left; }
  .preset small { display: block; color: var(--ui-dim); font-size: 11px; }
  .readout { margin: 0; padding: 10px; border: 1px solid var(--ui-line); border-radius: 8px; font-family: var(--ui-mono); font-size: 12px; line-height: 1.7; white-space: pre-line; }
  .prompt { margin: 0; padding: 10px; border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-bg); font-size: 13px; line-height: 1.6; }
  .copy { align-self: flex-start; }
  .stage { position: relative; overflow: hidden; background: #0b0d11; }
  .frame-wrap { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  iframe { display: block; border: 0; background: #fff; }
  .guide-lines { position: absolute; inset: 0; pointer-events: none; }
  .guide-lines i { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; } }
</style>
</head>
<body>
<div class="app">
  <aside class="controls">
    <h1>가이드 여백</h1>
    <p class="sub">폭 1280px 이상에서만 바뀝니다. 오른쪽은 실제 사이트입니다.</p>

    <fieldset>
      <legend>미리보기 화면 폭</legend>
      <div class="chips" id="widths"></div>
    </fieldset>

    <fieldset>
      <legend>프리셋</legend>
      <div class="presets" id="presets"></div>
    </fieldset>

    <fieldset>
      <legend>조절</legend>
      <div class="row">
        <label for="max">전체 최대 폭 <output id="max-out"></output></label>
        <input type="range" id="max" min="1312" max="1920" step="16">
        <small>넓힐수록 큰 화면에서 버튼이 왼쪽으로 갑니다.</small>
      </div>
      <div class="row">
        <label for="left">왼쪽 비율 (오른쪽 = 1) <output id="left-out"></output></label>
        <input type="range" id="left" min="0.3" max="1" step="0.05">
        <small>작을수록 본문이 왼쪽으로 갑니다. 1이면 가운데.</small>
      </div>
      <div class="row">
        <label for="min">왼쪽 칸 최소 폭 <output id="min-out"></output></label>
        <input type="range" id="min" min="8" max="16" step="0.5">
        <small>[→ 목차] [md] 버튼이 들어가는 칸입니다.</small>
      </div>
      <div class="row">
        <label for="gap">칸 사이 간격 <output id="gap-out"></output></label>
        <input type="range" id="gap" min="16" max="64" step="4">
      </div>
    </fieldset>

    <fieldset>
      <legend>측정 (미리보기 화면 기준)</legend>
      <p class="readout" id="readout">불러오는 중…</p>
    </fieldset>

    <fieldset>
      <legend>Claude에게 붙여 넣을 문장</legend>
      <p class="prompt" id="prompt"></p>
    </fieldset>
    <button type="button" class="copy" id="copy">복사</button>
  </aside>

  <main class="stage" id="stage">
    <div class="frame-wrap" id="wrap">
      <iframe id="frame" title="가이드 화면 미리보기" src="../../index.html#/final"></iframe>
    </div>
    <div class="guide-lines" id="lines" aria-hidden="true"></div>
  </main>
</div>

<script>
  // css/site.css 의 현재 값. 프롬프트는 이 값과 다른 것만 말한다.
  const DEFAULTS = { max: 1680, left: 0.5, min: 11, gap: 40 };
  // 변경 전 값: 본문이 가운데였던 상태. 측정에서 "변경 전 대비"의 기준.
  const BEFORE = { max: 1440, left: 1, min: 12, gap: 40 };
  const PRESETS = [
    { name: '변경 전', note: '본문 가운데, 최대 1440px', v: BEFORE },
    { name: '살짝', note: '왼쪽 0.7, 최대 1600px', v: { max: 1600, left: 0.7, min: 12, gap: 40 } },
    { name: '조금 더 (지금 적용됨)', note: '왼쪽 0.5, 최대 1680px', v: DEFAULTS },
    { name: '많이', note: '왼쪽 0.35, 최대 1760px', v: { max: 1760, left: 0.35, min: 10, gap: 32 } },
  ];
  const WIDTHS = [1280, 1440, 1680, 1920];
  const state = { ...DEFAULTS, vw: 1920 };

  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), wrap = $('wrap'), stage = $('stage');
  const fmt = { max: (v) => `${v}px`, left: (v) => `${(+v).toFixed(2)}fr`, min: (v) => `${v}rem`, gap: (v) => `${v}px` };

  WIDTHS.forEach((w) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = `${w}px`; b.dataset.w = w;
    b.addEventListener('click', () => { state.vw = w; updateAll(); });
    $('widths').append(b);
  });
  PRESETS.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'preset'; b.dataset.i = i;
    b.innerHTML = `${p.name}<small>${p.note}</small>`;
    b.addEventListener('click', () => { Object.assign(state, p.v); updateAll(); });
    $('presets').append(b);
  });
  ['max', 'left', 'min', 'gap'].forEach((k) => {
    $(k).addEventListener('input', (e) => { state[k] = +e.target.value; updateAll(); });
  });

  function css() {
    return `@media (min-width: 80rem) { html .guide { --guide-max: ${state.max}px; --guide-left: ${state.left}fr; --guide-left-min: ${state.min}rem; --guide-gap: ${state.gap}px; } }`;
  }

  function applyToFrame() {
    const doc = frame.contentDocument;
    if (!doc || !doc.head) return;
    let style = doc.getElementById('playground-style');
    if (!style) { style = doc.createElement('style'); style.id = 'playground-style'; doc.head.append(style); }
    style.textContent = css();
  }

  function fit() {
    const scale = Math.min(1, stage.clientWidth / state.vw);
    frame.style.width = `${state.vw}px`;
    frame.style.height = `${stage.clientHeight / scale}px`;
    wrap.style.transform = `scale(${scale})`;
    return scale;
  }

  /** 변경 전 값으로 같은 폭에서 본문이 어디에 있었는지 계산한다(스크롤바 제외). */
  function beforeDocLeft(vw) {
    const rem = 16, measure = 46 * rem, gutter = 64;
    const box = Math.min(vw, BEFORE.max);
    const inner = box - gutter * 2;
    const side = Math.max(BEFORE.min * rem, (inner - measure - BEFORE.gap * 2) / 2);
    return (vw - box) / 2 + gutter + side + BEFORE.gap;
  }

  function measure(scale) {
    const doc = frame.contentDocument;
    const tools = doc?.querySelector('.guide-tools'), body = doc?.querySelector('.doc');
    if (!tools || !body) { $('readout').textContent = '가이드 화면을 기다리는 중…'; return; }
    const t = tools.getBoundingClientRect(), d = body.getBoundingClientRect();
    const sb = frame.contentWindow.innerWidth - doc.documentElement.clientWidth;
    const shift = Math.round(beforeDocLeft(state.vw - sb) - d.left);
    $('readout').textContent =
      `버튼 왼쪽 끝  ${Math.round(t.left)}px\n` +
      `본문 왼쪽 끝  ${Math.round(d.left)}px\n` +
      `본문 오른쪽 여백  ${Math.round(state.vw - sb - d.right)}px\n` +
      `변경 전보다 본문이  ${shift >= 0 ? `${shift}px 왼쪽` : `${-shift}px 오른쪽`}`;
    $('lines').innerHTML = [[t.left, '#7aa2ff'], [d.left, '#ffb86b']]
      .map(([x, c]) => `<i style="left:${x * scale}px;color:${c}"></i>`).join('');
  }

  function updatePrompt() {
    const changed = Object.keys(DEFAULTS).filter((k) => state[k] !== DEFAULTS[k]);
    if (!changed.length) { $('prompt').textContent = '지금 적용된 값과 같습니다. 바꿀 것이 없습니다.'; return; }
    const names = { max: '--guide-max', left: '--guide-left', min: '--guide-left-min', gap: '--guide-gap' };
    const dir = state.left < DEFAULTS.left ? '본문을 조금 더 왼쪽으로' : state.left > DEFAULTS.left ? '본문을 가운데 쪽으로' : '여백을';
    $('prompt').textContent =
      `가이드 화면(폭 1280px 이상)에서 ${dir} 옮겨 줘. css/site.css 의 .guide 변수를 ` +
      changed.map((k) => `${names[k]}: ${fmt[k](state[k])}`).join(', ') +
      ' 로 바꾸고, 표가 오른쪽으로 튀어나오는 부분이 1280·1440·1920에서 잘리지 않는지 확인해 줘.';
  }

  function updateAll() {
    ['max', 'left', 'min', 'gap'].forEach((k) => { $(k).value = state[k]; $(`${k}-out`).textContent = fmt[k](state[k]); });
    document.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.w === state.vw));
    document.querySelectorAll('.preset').forEach((b) => {
      const v = PRESETS[b.dataset.i].v;
      b.setAttribute('aria-pressed', Object.keys(v).every((k) => v[k] === state[k]));
    });
    applyToFrame();
    const scale = fit();
    updatePrompt();
    requestAnimationFrame(() => requestAnimationFrame(() => measure(scale)));
  }

  frame.addEventListener('load', () => {
    updateAll();
    // 사이트가 가이드 본문을 비동기로 그리므로, 바뀔 때마다 다시 잰다.
    new MutationObserver(() => measure(fit())).observe(frame.contentDocument.body, { childList: true, subtree: true });
  });
  addEventListener('resize', () => measure(fit()));
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('prompt').textContent); $('copy').textContent = '복사됨'; }
    catch { $('copy').textContent = '복사 실패: 직접 선택해 주세요'; }
    setTimeout(() => { $('copy').textContent = '복사'; }, 1500);
  });
  updateAll();
</script>
</body>
</html>
